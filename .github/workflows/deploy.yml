name: 🚀 Deploy to VPS

on:
  push:
    branches:
      - main  # Ce workflow se lance à chaque push sur la branche main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📡 Connexion SSH et déploiement
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}   # Ajoute cette ligne si port ≠ 22
          script: |
            cd /var/www/dataforge
            ./deploy.sh
