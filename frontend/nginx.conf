server {
    listen 80;
    server_name _;

    # Frontend statique (React/Vue/Angular) si tu en as
    location / {
        root   /usr/share/nginx/html;   # dossier avec index.html
        index  index.html;
        try_files $uri /index.html;
    }

    # Toutes les requêtes API vers Django
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optionnel : fichiers statiques Django (CSS, JS, images)
    location /static/ {
        alias /app/static/;  # doit correspondre au STATIC_ROOT de Django
    }

    location /media/ {
        alias /app/media/;   # doit correspondre au MEDIA_ROOT de Django
    }
}
